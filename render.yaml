services:
  # 1. Backend Flask API Web Service (FREE PLAN)
  - type: web
    name: priere-bethesda-backend
    env: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: priere-bethesda-db
          property: connectionString
      - key: INFOBIP_API_KEY
        value: 8a31b4d78df6ab9cb4c03258412d0628-9a5ca74b-7826-4fa8-a600-b523cfff006b
      - key: INFOBIP_BASE_URL
        value: pd54el.api.infobip.com
      - key: OTP_TARGET_PHONE
        value: "2250556936994"

  # 2. Frontend React Vite Static Site (ALWAYS FREE)
  - type: web
    name: priere-bethesda-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: priere-bethesda-backend
          property: host

databases:
  # 3. PostgreSQL Database Instance on Render (FREE PLAN)
  - name: priere-bethesda-db
    databaseName: priere_bethesda
    user: priere_bethesda_user
    plan: free
    region: frankfurt
